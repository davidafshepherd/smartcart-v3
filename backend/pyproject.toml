[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "supplemental"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

fastapi = ">=0.121.3,<0.122.0"
uvicorn = ">=0.38.0,<0.39.0"
python-multipart = ">=0.0.20,<0.0.21"
pillow = ">=12.0.0,<13.0.0"
sqlalchemy = ">=2.0.44,<3.0.0"
pydantic = ">=2.12.4,<3.0.0"

# Hugging Face
huggingface-hub = ">=0.34.0,<1.0"
transformers = ">=4.57.3,<5.0.0"

# PyTorch (CUDA 12.1)
torch = { version = ">=2.5.1,<3.0.0", source = "pytorch" }
torchvision = { version = ">=0.20.1,<1.0.0", source = "pytorch" }

# SAM3
sam3 = { git = "https://github.com/facebookresearch/sam3.git" }
einops = "^0.8.1"
triton-windows = "^3.5.1.post22"
decord = "^0.6.0"
pycocotools = "^2.0.11"
psutil = "^7.1.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
