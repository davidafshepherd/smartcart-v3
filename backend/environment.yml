name: smartcart-v3

channels:
  - defaults

dependencies:
  - python=3.12
  - pip

  - pip:
      # PyTorch CUDA 12.1
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121

      # FastAPI
      - fastapi>=0.121.3,<0.122.0
      - uvicorn>=0.38.0,<0.39.0
      - python-multipart>=0.0.20,<0.0.21

      # Database / validation
      - pillow>=12.0.0,<13.0.0
      - sqlalchemy>=2.0.44,<3.0.0
      - pydantic>=2.12.4,<3.0.0

      # Hugging Face
      - huggingface-hub>=0.34.0,<1.0
      - transformers>=4.57.3,<5.0.0

      # SAM3
      - git+https://github.com/facebookresearch/sam3.git
      - einops>=0.8.1,<0.9.0
      - triton-windows>=3.5.1.post22,<4.0.0
      - decord>=0.6.0,<0.7.0
      - pycocotools>=2.0.11,<3.0.0
      - psutil>=7.1.3,<8.0.0

      # Volume estimation
      - opencv-python<4.12
      - scipy>=1.17.0,<2.0.0
